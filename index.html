<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakuga – Anime worth watching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ee; --surface: #ffffff; --surface2: #efeae2; --ink: #171a2b; --muted: #5d6480; --line: #dcd6ca;
  --accent: #e0457a; --on-accent: #ffffff; --gold: #a97a1f;
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", Georgia, serif;
  --body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pad: clamp(16px, 4vw, 56px);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e1c; --surface: #151a30; --surface2: #1d2340; --ink: #f3f0ea; --muted: #9ba3c0; --line: #2a3152;
    --accent: #ff6f9c; --on-accent: #260412; --gold: #f2c46d;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e1c; --surface: #151a30; --surface2: #1d2340; --ink: #f3f0ea; --muted: #9ba3c0; --line: #2a3152;
  --accent: #ff6f9c; --on-accent: #260412; --gold: #f2c46d;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }

/* generated artwork */
.art { position: absolute; inset: 0; overflow: hidden; isolation: isolate;
  background:
    radial-gradient(circle 36cqmin at 74% 30%, color-mix(in srgb, var(--c) 62%, transparent) 0 99%, transparent 100%),
