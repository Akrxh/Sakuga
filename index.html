<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakuga – Anime worth watching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ee; --surface: #ffffff; --surface2: #efeae2; --ink: #171a2b; --muted: #5d6480; --line: #dcd6ca;
  --accent: #e0457a; --on-accent: #ffffff; --gold: #a97a1f;
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", Georgia, serif;
  --body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pad: clamp(16px, 4vw, 56px);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e1c; --surface: #151a30; --surface2: #1d2340; --ink: #f3f0ea; --muted: #9ba3c0; --line: #2a3152;
    --accent: #ff6f9c; --on-accent: #260412; --gold: #f2c46d;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e1c; --surface: #151a30; --surface2: #1d2340; --ink: #f3f0ea; --muted: #9ba3c0; --line: #2a3152;
  --accent: #ff6f9c; --on-accent: #260412; --gold: #f2c46d;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }

/* generated artwork */
.art { position: absolute; inset: 0; overflow: hidden; isolation: isolate;
  background:
    radial-gradient(circle 36cqmin at 74% 30%, color-mix(in srgb, var(--c) 62%, transparent) 0 99%, transparent 100%),
    repeating-linear-gradient(115deg, #ffffff12 0 2px, transparent 2px 24px),
    radial-gradient(90% 70% at 8% 100%, var(--c2), transparent 72%),
    linear-gradient(170deg, color-mix(in srgb, var(--c) 42%, #080a16), #080a16); }
.art::before { content: attr(data-initial); position: absolute; left: 6%; bottom: -14%; font-family: var(--display); font-weight: 800; font-size: 80cqh; line-height: 1; color: #fff; opacity: .1; z-index: -1; }
.art::after { content: ""; position: absolute; inset: 0; opacity: .2; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.alt { position: absolute; z-index: 2; right: 10px; top: 12px; writing-mode: vertical-rl; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .14em; color: #fff; opacity: .85; text-shadow: 0 1px 8px #0008; pointer-events: none; max-height: 70%; overflow: hidden; }


a.pill { display: inline-flex; align-items: center; text-decoration: none; }
#submit { width: min(720px, calc(100% - 16px)); max-height: 92vh; }
/* header */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 24px; padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--pad) 10px; background: linear-gradient(#000b, #0000); transition: background .25s; }
.top.solid { background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 1px 0 var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .01em; color: #fff; background: none; border: 0; padding: 0; }
.top.solid .brand { color: var(--ink); }
.logo { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(from 200deg, var(--accent), var(--gold), var(--accent)); display: grid; place-items: center; color: #1a0a10; }
.nav { display: flex; gap: 4px; order: 4; width: 100%; }
.nav button { background: none; border: 0; padding: 7px 14px; border-radius: 999px; font-size: 14.5px; font-weight: 600; color: #ffffffcc; }
.top.solid .nav button { color: var(--muted); }
.nav button:hover { color: #fff; }
.top.solid .nav button:hover { color: var(--ink); }
.nav button[aria-current="true"] { background: #ffffff26; color: #fff; box-shadow: inset 0 -2px 0 var(--gold); border-radius: 999px 999px 8px 8px; }
.top.solid .nav button[aria-current="true"] { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); }
.right { margin-left: auto; display: flex; align-items: center; gap: 10px; position: relative; order: 2; z-index: 10; }
.brand { order: 1; }
.searchbox { order: 3; width: 100%; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 6px 0 14px; border-radius: 999px; border: 1.5px solid #ffffff40; background: #00000066; color: #fff; backdrop-filter: blur(10px); transition: border-color .2s, background .2s, box-shadow .2s; }
.searchbox:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 28%, transparent); }
.top.solid .searchbox { background: var(--surface); border-color: var(--line); color: var(--ink); }
.top.solid .searchbox:focus-within { border-color: var(--gold); }
.sicon { flex: none; display: grid; place-items: center; opacity: .8; }
.searchbox input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font-size: 15px; color: inherit; -webkit-appearance: none; appearance: none; }
.searchbox input::-webkit-search-cancel-button { display: none; }
.searchbox input::placeholder { color: inherit; opacity: .6; }
#sclear { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: color-mix(in srgb, currentColor 16%, transparent); color: inherit; display: grid; place-items: center; }
.avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold); background: var(--surface2); color: var(--ink); font-weight: 700; font-family: var(--display); }
.menu { position: absolute; z-index: 20; right: 0; top: 48px; min-width: 220px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 20px 50px #0008; }
.menu[hidden] { display: none; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 9px; font-size: 14.5px; }
.menu button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }

/* billboard */
.billboard { position: relative; height: clamp(520px, 86vh, 780px); container-type: size; color: #fff; }
.billboard::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, #060814e6 0%, #06081499 40%, transparent 75%); }
.billboard::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 200px; z-index: 1; background: linear-gradient(transparent, var(--bg)); }
.bb { position: absolute; z-index: 2; left: var(--pad); bottom: 120px; max-width: min(580px, calc(100% - 2 * var(--pad))); }
.bb.swap { animation: rise .55s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.chips2 { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.badge { font-size: 12.5px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: #ffffff26; backdrop-filter: blur(8px); }
.badge.gold { background: var(--gold); color: #241800; }
.bb h1 { font-family: var(--display); font-weight: 800; font-size: clamp(42px, 7.6vw, 88px); line-height: 1; letter-spacing: -.01em; margin: 0 0 14px; text-shadow: 0 4px 30px #0009; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 14.5px; font-weight: 500; margin-bottom: 12px; text-shadow: 0 1px 8px #0008; }
.score { color: var(--gold); font-weight: 700; }
.bb p { margin: 0 0 22px; font-size: 16.5px; max-width: 52ch; text-shadow: 0 1px 10px #000a; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 9px; height: 46px; padding: 0 22px; border-radius: 999px; border: 0; font-weight: 700; font-size: 15.5px; text-decoration: none; }
.btn.go { background: var(--accent); color: var(--on-accent); }
.btn.go:hover { filter: brightness(1.08); }
.btn.ghost { background: #ffffff2e; color: #fff; backdrop-filter: blur(10px); }
.btn.ghost:hover { background: #ffffff45; }
.vert { position: absolute; z-index: 2; right: var(--pad); top: 130px; writing-mode: vertical-rl; font-family: var(--display); font-weight: 700; font-size: clamp(26px, 4.2vw, 46px); letter-spacing: .28em; color: #fff; text-shadow: 0 2px 20px #0009; padding-left: 16px; border-left: 2px solid var(--gold); max-height: 60%; overflow: hidden; }
.dots { position: absolute; z-index: 2; right: var(--pad); bottom: 128px; display: flex; gap: 8px; }
.dots button { width: 26px; height: 5px; border-radius: 3px; border: 0; padding: 0; background: #ffffff55; }
.dots button[aria-current="true"] { background: var(--gold); }

/* rows and cards */
.rows { position: relative; z-index: 3; margin-top: -84px; padding-bottom: 30px; }
.row { margin-bottom: 6px; }
.row h2 { font-family: var(--display); font-weight: 800; font-size: clamp(21px, 2.6vw, 28px); margin: 0 var(--pad) 2px; }
.rail { position: relative; }
.track { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; padding: 16px var(--pad) 22px; scroll-padding-left: var(--pad); scrollbar-width: none; }
.track::-webkit-scrollbar { display: none; }
.arrow { position: absolute; top: 16px; bottom: 22px; width: 52px; z-index: 5; border: 0; display: none; place-items: center; opacity: 0; transition: opacity .2s; }
.arrow.l { left: 0; background: linear-gradient(90deg, var(--bg), transparent); }
.arrow.r { right: 0; background: linear-gradient(270deg, var(--bg), transparent); }
@media (hover: hover) { .arrow { display: grid; } .rail:hover .arrow { opacity: 1; } }
.card { position: relative; flex: none; width: clamp(140px, 38vw, 196px); scroll-snap-align: start; }
.grid .card { width: auto; }
.poster { position: relative; aspect-ratio: 2 / 3; border-radius: 12px; overflow: hidden; container-type: size; background: #000; color: #fff; transition: transform .25s, box-shadow .25s; }
.poster::after { content: ""; position: absolute; inset: 0; z-index: 2; background: linear-gradient(transparent 50%, #000000d9); pointer-events: none; }
.open { position: absolute; inset: 0; z-index: 3; width: 100%; background: none; border: 0; border-radius: 12px; }
.ct { position: absolute; z-index: 2; left: 12px; right: 34px; bottom: 32px; font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.15; text-shadow: 0 2px 12px #000a; pointer-events: none; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.eps-tag { position: absolute; z-index: 2; left: 12px; bottom: 11px; font-size: 12px; font-weight: 600; opacity: .9; pointer-events: none; }
.rate { position: absolute; z-index: 2; left: 10px; top: 10px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #000000a8; color: #f2c46d; backdrop-filter: blur(6px); pointer-events: none; }
.play { position: absolute; z-index: 4; right: 10px; bottom: 10px; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; text-decoration: none; opacity: 0; transform: scale(.85); transition: .2s; }
.play:focus-visible, .card:focus-within .play { opacity: 1; transform: none; }
.cap { padding: 9px 2px 0; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
@media (hover: hover) {
  .card:hover .poster { transform: translateY(-6px); box-shadow: 0 0 0 2px var(--gold), 0 18px 40px #0009; }
  .card:hover .play { opacity: 1; transform: none; }
}
@media (hover: none) { .play { opacity: 1; transform: none; } }

/* browse pages */
.page { padding: calc(env(safe-area-inset-top, 0px) + 110px) var(--pad) 40px; min-height: 70vh; }
.page h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 5vw, 48px); margin: 0 0 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 18px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 15px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 14px; }
.empty { padding: 60px 0; color: var(--muted); }
.empty b { display: block; font-family: var(--display); font-size: 28px; color: var(--ink); margin-bottom: 6px; }

/* dialogs */
dialog { border: 0; padding: 0; background: var(--surface); color: var(--ink); border-radius: 22px; box-shadow: 0 40px 100px #000c; overflow: auto; }
dialog::backdrop { background: #000000b0; backdrop-filter: blur(4px); }
#detail { width: min(900px, calc(100% - 16px)); max-height: 92vh; }
.d-art { position: relative; height: 320px; container-type: size; color: #fff; }
.d-art::after { content: ""; position: absolute; inset: 0; z-index: 3; background: linear-gradient(transparent 35%, var(--surface)); }
.x { position: sticky; top: 12px; float: right; margin: 12px 12px 0 0; z-index: 10; width: 38px; height: 38px; border-radius: 50%; border: 0; background: #000000a8; color: #fff; display: grid; place-items: center; }
.d-body { padding: 0 clamp(18px, 4vw, 40px) 34px; margin-top: -84px; position: relative; z-index: 4; }
.d-body h2 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 6vw, 54px); line-height: 1.02; margin: 0 0 4px; }
.jp { font-family: var(--display); color: var(--gold); font-weight: 700; font-size: 18px; letter-spacing: .12em; margin-bottom: 10px; }
.d-body .facts { text-shadow: none; color: var(--muted); }
.d-body p.desc { font-size: 16.5px; max-width: 64ch; margin: 0 0 20px; }
.d-body .btn.ghost { background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); }
.d-body h3 { font-family: var(--display); font-size: 24px; margin: 34px 0 12px; }
.seasons { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.epwrap { display: grid; gap: 10px; }
a.ep { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--surface2); text-decoration: none; border: 1.5px solid transparent; }
a.ep:hover { border-color: var(--accent); }
.epn { width: 54px; height: 54px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; color: #fff; background: linear-gradient(135deg, var(--c), var(--c2)); }
.ept b { display: block; font-weight: 600; line-height: 1.3; }
.ept small { color: var(--muted); font-size: 13px; }
.ept p { margin: 4px 0 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.epgo { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.noeps { color: var(--muted); padding: 10px 0; }
.d-body .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }

/* manage */
#manage { width: min(720px, calc(100% - 16px)); max-height: 92vh; }
.dlg { padding: 20px 22px 24px; display: grid; gap: 14px; }
.dlg h2 { font-family: var(--display); font-size: 30px; margin: 0; }
.dlg p.hint { margin: 0; color: var(--muted); font-size: 14px; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.fg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fg .full { grid-column: 1 / -1; }
.f label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
.f input, .f select, .f textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); font-size: 15px; }
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--accent); }
.f textarea { min-height: 90px; resize: vertical; }
.f small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14.5px; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
#json { width: 100%; min-height: 340px; resize: vertical; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.5; }
#json:focus { outline: none; border-color: var(--accent); }
.err { color: #ff6b81; font-size: 14px; min-height: 20px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.btns div { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { height: 40px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-weight: 600; font-size: 14.5px; }
.pill.go { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
[hidden] { display: none !important; }

footer { padding: 26px var(--pad) 44px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; }
footer b { color: var(--ink); font-family: var(--display); font-size: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 200; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 720px) { .top { flex-wrap: nowrap; } .nav { order: 2; width: auto; } .searchbox { order: 3; width: min(340px, 34vw); margin-left: auto; } .right { order: 4; margin-left: 0; } .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
@media (max-width: 560px) {
  .bb { bottom: 124px; }
  .dots { left: var(--pad); right: auto; bottom: 92px; }
  .billboard::before { background: linear-gradient(0deg, #060814f0 8%, #06081466 58%, transparent); }
  .vert { font-size: 22px; top: 170px; }
  .page { padding-top: calc(env(safe-area-inset-top, 0px) + 172px); }
  .btn { height: 44px; padding: 0 18px; }
  .d-art { height: 230px; }
  .fg { grid-template-columns: 1fr; }
  a.ep { grid-template-columns: auto 1fr; } .epgo { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bb.swap { animation: none; } .poster, .play, .toast, .searchbox { transition: none; } }
</style>
</head>
<body>
<header class="top" id="top">
  <button class="brand" id="brand" type="button" aria-label="Home">
    <span class="logo" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><pa
